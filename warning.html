<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720px;
    height: 1280px;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 60px;
    text-align: center;
  }
  .logo {
    width: 140px;
    height: 140px;
    margin-bottom: 60px;
  }
  .text {
    color: #FFEB3B;
    font-size: 40px;
    font-weight: 700;
    line-height: 1.6;
    letter-spacing: 1px;
    max-width: 600px;
  }
  .text .divider {
    margin: 40px 0;
  }
  .hotline {
    font-size: 44px;
    font-weight: 800;
    margin-top: 30px;
  }
</style>
</head>
<body>
  <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <polygon points="50,8 92,88 8,88" fill="#E53935" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <rect x="45" y="35" width="10" height="28" fill="#fff" rx="2"/>
    <circle cx="50" cy="72" r="6" fill="#fff"/>
  </svg>
  <div class="text">
    Do điện thoại này đang quá hạn trong thời gian dài, nhằm an đảm bảo an toàn, thiết bị đang được công ty BY-Chi nhánh Hà Nội quản lý.
    <div class="divider"></div>
    Vui lòng liên hệ để được hỗ trợ:
    <div class="hotline">0868887819</div>
  </div>
</body>
</html>
